---
- name: Install fake-gpu-operator with DRA/KWOK simulation enabled
  ansible.builtin.shell: |
    set -euo pipefail
    export KUBECONFIG="{{ repo_root }}/kubeconfig"

    version_args=()
    chart_version="{{ fake_gpu_operator_version }}"
    chart_version="${chart_version#v}"
    if [[ -n "$chart_version" ]]; then
      version_args=(--version "$chart_version")
    fi

    helm upgrade -i gpu-operator oci://ghcr.io/run-ai/fake-gpu-operator/fake-gpu-operator \
      -n gpu-operator --create-namespace \
      "${version_args[@]}" \
      --set 'topology.nodePools.default.gpuCount=8' \
      --set 'topology.nodePools.default.gpuProduct=NVIDIA-H100-80GB-HBM3' \
      --set 'topology.nodePools.default.gpuMemory=81920' \
      --set 'draPlugin.enabled=true' \
      --set 'kwokDraPlugin.enabled=true' \
      --set 'devicePlugin.enabled=false' \
      --set 'kwokGpuDevicePlugin.enabled=false'
    kubectl -n gpu-operator rollout status deployment --timeout=180s || true
    kubectl get nodes -l run.ai/simulated-gpu-node-pool=default
  args:
    executable: /bin/bash
  become: false
  changed_when: false
