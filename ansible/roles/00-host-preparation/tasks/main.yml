---
- name: Install base packages
  ansible.builtin.apt:
    name: [curl, tar, jq, ca-certificates, gnupg, lsb-release, make, g++, python3]
    state: present
    update_cache: true

- name: Raise inotify limits for dense local clusters
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kai-scheduler-101-inotify.conf
    mode: "0644"
    content: |
      fs.inotify.max_user_instances=1024
      fs.inotify.max_user_watches=1048576

- name: Apply inotify limits
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Install Docker when missing
  ansible.builtin.shell: |
    set -euo pipefail
    command -v docker >/dev/null 2>&1 || curl -fsSL https://get.docker.com | sh
    systemctl enable --now docker || true
  args:
    executable: /bin/bash
  changed_when: false
