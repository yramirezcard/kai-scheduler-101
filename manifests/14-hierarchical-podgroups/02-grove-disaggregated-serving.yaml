apiVersion: v1
kind: Namespace
metadata:
  name: kai-lab14
  labels:
    kai-scheduler-101/chapter: "14"
---
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: grove-demo
  labels:
    kai-scheduler-101/chapter: "14"
spec:
  resources:
    cpu: { quota: -1, limit: -1, overQuotaWeight: 1 }
    memory: { quota: -1, limit: -1, overQuotaWeight: 1 }
---
apiVersion: grove.io/v1alpha1
kind: PodCliqueSet
metadata:
  name: multinode-disaggregated
  namespace: kai-lab14
  labels:
    app: multinode-disaggregated
    kai-scheduler-101/chapter: "14"
spec:
  replicas: 2
  template:
    cliqueStartupType: CliqueStartupTypeInOrder
    cliques:
      - name: router
        labels:
          app: multinode-disaggregated
          role: router
          kai.scheduler/queue: grove-demo
          kai-scheduler-101/chapter: "14"
        spec:
          roleName: router
          replicas: 2
          minAvailable: 1
          podSpec:
            schedulerName: kai-scheduler
            tolerations: [ { key: kwok.x-k8s.io/node, operator: Exists, effect: NoSchedule } ]
            containers:
              - name: router
                image: nginx:latest
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
      - name: prefill-leader
        labels:
          app: multinode-disaggregated
          role: prefill-leader
          kai.scheduler/queue: grove-demo
          kai-scheduler-101/chapter: "14"
        spec:
          roleName: prefill-leader
          replicas: 1
          minAvailable: 1
          podSpec:
            schedulerName: kai-scheduler
            tolerations: [ { key: kwok.x-k8s.io/node, operator: Exists, effect: NoSchedule } ]
            containers:
              - name: prefill-leader
                image: nginx:latest
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
      - name: prefill-worker
        labels:
          app: multinode-disaggregated
          role: prefill-worker
          kai.scheduler/queue: grove-demo
          kai-scheduler-101/chapter: "14"
        spec:
          roleName: prefill-worker
          replicas: 3
          minAvailable: 2
          podSpec:
            schedulerName: kai-scheduler
            tolerations: [ { key: kwok.x-k8s.io/node, operator: Exists, effect: NoSchedule } ]
            containers:
              - name: prefill-worker
                image: nginx:latest
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
      - name: decode-leader
        labels:
          app: multinode-disaggregated
          role: decode-leader
          kai.scheduler/queue: grove-demo
          kai-scheduler-101/chapter: "14"
        spec:
          roleName: decode-leader
          replicas: 1
          minAvailable: 1
          podSpec:
            schedulerName: kai-scheduler
            tolerations: [ { key: kwok.x-k8s.io/node, operator: Exists, effect: NoSchedule } ]
            containers:
              - name: decode-leader
                image: nginx:latest
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
      - name: decode-worker
        labels:
          app: multinode-disaggregated
          role: decode-worker
          kai.scheduler/queue: grove-demo
          kai-scheduler-101/chapter: "14"
        spec:
          roleName: decode-worker
          replicas: 4
          minAvailable: 3
          podSpec:
            schedulerName: kai-scheduler
            tolerations: [ { key: kwok.x-k8s.io/node, operator: Exists, effect: NoSchedule } ]
            containers:
              - name: decode-worker
                image: nginx:latest
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
    podCliqueScalingGroups:
      - name: prefill
        cliqueNames:
          - prefill-leader
          - prefill-worker
        replicas: 1
        minAvailable: 1
      - name: decode
        cliqueNames:
          - decode-leader
          - decode-worker
        replicas: 2
        minAvailable: 1
