apiVersion: v1
kind: Namespace
metadata:
  name: kai-lab12
  labels: { kai-scheduler-101/chapter: "12" }
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-one
  namespace: kai-lab12
  labels: { kai-scheduler-101/chapter: "12" }
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly: { allocationMode: ExactCount, count: 1, deviceClassName: gpu.nvidia.com }
---
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: gang-demo
  labels: { kai-scheduler-101/chapter: "12" }
spec:
  resources:
    gpu: { quota: 12, limit: 16, overQuotaWeight: 1 }
