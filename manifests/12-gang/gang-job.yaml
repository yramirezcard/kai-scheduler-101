apiVersion: v1
kind: Namespace
metadata:
  name: kai-lab12
  labels: { kai-scheduler-101/chapter: "12" }
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-one
  namespace: kai-lab12
  labels: { kai-scheduler-101/chapter: "12" }
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly: { allocationMode: ExactCount, count: 1, deviceClassName: gpu.nvidia.com }
---
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: gang-demo
  labels: { kai-scheduler-101/chapter: "12" }
spec:
  resources:
    gpu: { quota: 4, limit: 4, overQuotaWeight: 1 }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gang-four
  namespace: kai-lab12
  labels:
    kai-scheduler-101/chapter: "12"
  annotations:
    kai.scheduler/batch-min-member: "4"
spec:
  parallelism: 4
  completions: 4
  template:
    metadata: { labels: { kai.scheduler/queue: gang-demo, kai-scheduler-101/chapter: "12" } }
    spec:
      schedulerName: kai-scheduler
      restartPolicy: Never
      tolerations: [ { key: kwok.x-k8s.io/node, operator: Exists, effect: NoSchedule } ]
      resourceClaims: [ { name: gpu, resourceClaimTemplateName: gpu-one } ]
      containers:
        - name: worker
          image: ubuntu:22.04
          command: ["bash", "-lc"]
          args: ["echo gang worker; sleep 3600"]
          resources: { claims: [ { name: gpu } ] }
