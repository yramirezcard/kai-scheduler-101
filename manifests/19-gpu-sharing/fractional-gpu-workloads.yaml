apiVersion: v1
kind: Namespace
metadata:
  name: namespace-a
  labels:
    kai-scheduler-101/chapter: "19"
---
apiVersion: v1
kind: Namespace
metadata:
  name: namespace-b
  labels:
    kai-scheduler-101/chapter: "19"
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-one
  namespace: namespace-a
  labels:
    kai-scheduler-101/chapter: "19"
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly: { allocationMode: ExactCount, count: 1, deviceClassName: gpu.nvidia.com }
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-one
  namespace: namespace-b
  labels:
    kai-scheduler-101/chapter: "19"
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly: { allocationMode: ExactCount, count: 1, deviceClassName: gpu.nvidia.com }
---
apiVersion: v1
kind: Pod
metadata:
  name: gpu-share-half-a
  namespace: namespace-a
  labels:
    kai.scheduler/queue: default-queue
    kai-scheduler-101/chapter: "19"
  annotations:
    gpu-fraction: "0.5"
spec:
  schedulerName: kai-scheduler
  restartPolicy: Never
  tolerations: [ { key: kwok.x-k8s.io/node, operator: Exists, effect: NoSchedule } ]
  resourceClaims: [ { name: gpu, resourceClaimTemplateName: gpu-one } ]
  containers:
    - name: workload
      image: ubuntu:22.04
      command: ["bash", "-lc"]
      args: ["echo half gpu workload a; sleep 3600"]
      resources: { claims: [ { name: gpu } ] }
---
apiVersion: v1
kind: Pod
metadata:
  name: gpu-share-half-b
  namespace: namespace-b
  labels:
    kai.scheduler/queue: default-queue
    kai-scheduler-101/chapter: "19"
  annotations:
    gpu-fraction: "0.5"
spec:
  schedulerName: kai-scheduler
  restartPolicy: Never
  tolerations: [ { key: kwok.x-k8s.io/node, operator: Exists, effect: NoSchedule } ]
  resourceClaims: [ { name: gpu, resourceClaimTemplateName: gpu-one } ]
  containers:
    - name: workload
      image: ubuntu:22.04
      command: ["bash", "-lc"]
      args: ["echo half gpu workload b; sleep 3600"]
      resources: { claims: [ { name: gpu } ] }
