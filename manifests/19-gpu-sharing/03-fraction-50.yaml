apiVersion: v1
kind: Pod
metadata:
  name: gpu-share-50
  namespace: namespace-c
  labels:
    kai.scheduler/queue: gpu-sharing-demo
    kai-scheduler-101/chapter: "19"
  annotations:
    gpu-fraction: "0.5"
spec:
  schedulerName: kai-scheduler
  restartPolicy: Never
  tolerations: [ { key: kwok.x-k8s.io/node, operator: Exists, effect: NoSchedule } ]
  containers:
    - name: workload
      image: ubuntu:22.04
      command: ["bash", "-lc"]
      args: ["echo 50 percent gpu workload; sleep 3600"]
