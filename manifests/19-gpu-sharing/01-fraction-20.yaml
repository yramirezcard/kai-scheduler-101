apiVersion: v1
kind: Pod
metadata:
  name: gpu-share-20
  namespace: namespace-a
  labels:
    kai.scheduler/queue: gpu-sharing-demo
    kai-scheduler-101/chapter: "19"
  annotations:
    gpu-fraction: "0.2"
spec:
  schedulerName: kai-scheduler
  restartPolicy: Never
  tolerations: [ { key: kwok.x-k8s.io/node, operator: Exists, effect: NoSchedule } ]
  resourceClaims: [ { name: gpu, resourceClaimTemplateName: gpu-one } ]
  containers:
    - name: workload
      image: ubuntu:22.04
      command: ["bash", "-lc"]
      args: ["echo 20 percent gpu workload; sleep 3600"]
      resources: { claims: [ { name: gpu } ] }
