apiVersion: v1
kind: Namespace
metadata:
  name: kai-lab03
  labels:
    kai-scheduler-101/chapter: "03"
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-one
  namespace: kai-lab03
  labels:
    kai-scheduler-101/chapter: "03"
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            allocationMode: ExactCount
            count: 1
            deviceClassName: gpu.nvidia.com
---
apiVersion: v1
kind: Pod
metadata:
  name: default-queue-dra-pod
  namespace: kai-lab03
  labels:
    kai.scheduler/queue: default-queue
    kai-scheduler-101/chapter: "03"
spec:
  schedulerName: kai-scheduler
  restartPolicy: Never
  tolerations:
    - key: kwok.x-k8s.io/node
      operator: Exists
      effect: NoSchedule
  resourceClaims:
    - name: gpu
      resourceClaimTemplateName: gpu-one
  containers:
    - name: trainer
      image: ubuntu:22.04
      command: ["bash", "-lc"]
      args: ["echo scheduled through KAI with a DRA GPU claim; sleep 3600"]
      resources:
        claims:
          - name: gpu
