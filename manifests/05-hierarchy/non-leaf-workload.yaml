apiVersion: apps/v1
kind: Deployment
metadata:
  name: non-leaf-target
  namespace: kai-lab05
  labels:
    kai-scheduler-101/chapter: "05"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: non-leaf-target
  template:
    metadata:
      labels:
        app: non-leaf-target
        kai.scheduler/queue: foundation-models
        kai-scheduler-101/chapter: "05"
    spec:
      schedulerName: kai-scheduler
      tolerations: [ { key: kwok.x-k8s.io/node, operator: Exists, effect: NoSchedule } ]
      resourceClaims: [ { name: gpu, resourceClaimTemplateName: gpu-one } ]
      containers:
        - name: worker
          image: ubuntu:22.04
          command: ["bash", "-lc"]
          args: ["echo this workload intentionally targets a non-leaf queue; sleep 3600"]
          resources: { claims: [ { name: gpu } ] }
