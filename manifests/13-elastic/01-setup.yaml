apiVersion: v1
kind: Namespace
metadata:
  name: kai-lab13
  labels:
    kai-scheduler-101/chapter: "13"
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-one
  namespace: kai-lab13
  labels:
    kai-scheduler-101/chapter: "13"
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly: { allocationMode: ExactCount, count: 1, deviceClassName: gpu.nvidia.com }
---
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: elastic-demo
  labels:
    kai-scheduler-101/chapter: "13"
spec:
  resources:
    gpu: { quota: 8, limit: 8, overQuotaWeight: 1 }
