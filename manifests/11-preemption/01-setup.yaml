apiVersion: v1
kind: Namespace
metadata:
  name: kai-lab11
  labels: { kai-scheduler-101/chapter: "11" }
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-one
  namespace: kai-lab11
  labels: { kai-scheduler-101/chapter: "11" }
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly: { allocationMode: ExactCount, count: 1, deviceClassName: gpu.nvidia.com }
---
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: preemption-demo
  labels: { kai-scheduler-101/chapter: "11" }
spec:
  resources:
    gpu: { quota: 2, limit: 2, overQuotaWeight: 1 }
