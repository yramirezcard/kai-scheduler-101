apiVersion: v1
kind: Namespace
metadata:
  name: kai-lab07
  labels: { kai-scheduler-101/chapter: "07" }
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-one
  namespace: kai-lab07
  labels: { kai-scheduler-101/chapter: "07" }
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly: { allocationMode: ExactCount, count: 1, deviceClassName: gpu.nvidia.com }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision-team-gpu-heavy
  namespace: kai-lab07
  labels: { kai-scheduler-101/chapter: "07" }
spec:
  replicas: 5
  selector: { matchLabels: { app: vision-team-gpu-heavy } }
  template:
    metadata:
      labels:
        app: vision-team-gpu-heavy
        kai.scheduler/queue: vision-team
        kai-scheduler-101/chapter: "07"
    spec:
      schedulerName: kai-scheduler
      priorityClassName: train
      tolerations: [ { key: kwok.x-k8s.io/node, operator: Exists, effect: NoSchedule } ]
      resourceClaims: [ { name: gpu, resourceClaimTemplateName: gpu-one } ]
      containers:
        - name: vision
          image: ubuntu:22.04
          command: ["bash", "-lc"]
          args: ["echo vision workload: high GPU, modest CPU and memory; sleep 3600"]
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "500m", memory: "1Gi" }
            claims: [ { name: gpu } ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-team-memory-heavy
  namespace: kai-lab07
  labels: { kai-scheduler-101/chapter: "07" }
spec:
  replicas: 2
  selector: { matchLabels: { app: llm-team-memory-heavy } }
  template:
    metadata:
      labels:
        app: llm-team-memory-heavy
        kai.scheduler/queue: llm-team
        kai-scheduler-101/chapter: "07"
    spec:
      schedulerName: kai-scheduler
      priorityClassName: train
      tolerations: [ { key: kwok.x-k8s.io/node, operator: Exists, effect: NoSchedule } ]
      resourceClaims: [ { name: gpu, resourceClaimTemplateName: gpu-one } ]
      containers:
        - name: llm
          image: ubuntu:22.04
          command: ["bash", "-lc"]
          args: ["echo llm workload: fewer GPUs, high memory; sleep 3600"]
          resources:
            requests: { cpu: "500m", memory: "12Gi" }
            limits: { cpu: "1", memory: "16Gi" }
            claims: [ { name: gpu } ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-processing-cpu-heavy
  namespace: kai-lab07
  labels: { kai-scheduler-101/chapter: "07" }
spec:
  replicas: 6
  selector: { matchLabels: { app: data-processing-cpu-heavy } }
  template:
    metadata:
      labels:
        app: data-processing-cpu-heavy
        kai.scheduler/queue: data-processing
        kai-scheduler-101/chapter: "07"
    spec:
      schedulerName: kai-scheduler
      priorityClassName: train
      tolerations: [ { key: kwok.x-k8s.io/node, operator: Exists, effect: NoSchedule } ]
      containers:
        - name: batch
          image: ubuntu:22.04
          command: ["bash", "-lc"]
          args: ["echo data processing workload: CPU-heavy, no GPU claim; sleep 3600"]
          resources:
            requests: { cpu: "2", memory: "1Gi" }
            limits: { cpu: "2", memory: "2Gi" }
