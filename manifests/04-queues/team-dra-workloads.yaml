apiVersion: v1
kind: Namespace
metadata:
  name: kai-lab04
  labels:
    kai-scheduler-101/chapter: "04"
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-one
  namespace: kai-lab04
  labels:
    kai-scheduler-101/chapter: "04"
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            allocationMode: ExactCount
            count: 1
            deviceClassName: gpu.nvidia.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-train
  namespace: kai-lab04
  labels:
    kai-scheduler-101/chapter: "04"
spec:
  replicas: 2
  selector:
    matchLabels: { app: research-train }
  template:
    metadata:
      labels:
        app: research-train
        kai.scheduler/queue: research
        kai-scheduler-101/chapter: "04"
    spec:
      schedulerName: kai-scheduler
      tolerations:
        - key: kwok.x-k8s.io/node
          operator: Exists
          effect: NoSchedule
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: gpu-one
      containers:
        - name: trainer
          image: ubuntu:22.04
          command: ["bash", "-lc"]
          args: ["echo research replica; sleep 3600"]
          resources:
            claims:
              - name: gpu
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-train
  namespace: kai-lab04
  labels:
    kai-scheduler-101/chapter: "04"
spec:
  replicas: 2
  selector:
    matchLabels: { app: platform-train }
  template:
    metadata:
      labels:
        app: platform-train
        kai.scheduler/queue: platform
        kai-scheduler-101/chapter: "04"
    spec:
      schedulerName: kai-scheduler
      tolerations:
        - key: kwok.x-k8s.io/node
          operator: Exists
          effect: NoSchedule
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: gpu-one
      containers:
        - name: trainer
          image: ubuntu:22.04
          command: ["bash", "-lc"]
          args: ["echo platform replica; sleep 3600"]
          resources:
            claims:
              - name: gpu
