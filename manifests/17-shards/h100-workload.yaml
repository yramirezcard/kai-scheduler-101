apiVersion: v1
kind: Namespace
metadata:
  name: kai-lab17-h100
  labels:
    kai-scheduler-101/chapter: "17"
---
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: h100-research
  labels:
    kai-scheduler-101/chapter: "17"
    kai.scheduler/node-pool: h100
spec:
  resources:
    cpu: { quota: 8, limit: 16, overQuotaWeight: 1 }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: h100-training
  namespace: kai-lab17-h100
  labels:
    kai-scheduler-101/chapter: "17"
    kai.scheduler/node-pool: h100
spec:
  parallelism: 2
  completions: 2
  template:
    metadata:
      labels:
        kai.scheduler/queue: h100-research
        kai.scheduler/node-pool: h100
        kai-scheduler-101/chapter: "17"
    spec:
      schedulerName: kai-scheduler
      restartPolicy: Never
      tolerations: [ { key: kwok.x-k8s.io/node, operator: Exists, effect: NoSchedule } ]
      containers:
        - name: worker
          image: ubuntu:22.04
          command: ["bash", "-lc"]
          args: ["echo h100 shard worker; sleep 3600"]
          resources:
            requests:
              cpu: "2"
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 256Mi
