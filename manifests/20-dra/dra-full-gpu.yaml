apiVersion: v1
kind: Namespace
metadata:
  name: kai-lab20
  labels: { kai-scheduler-101/chapter: "20" }
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-full
  namespace: kai-lab20
  labels:
    kai-scheduler-101/chapter: "20"
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            allocationMode: ExactCount
            count: 1
            deviceClassName: gpu.nvidia.com
---
apiVersion: v1
kind: Pod
metadata:
  name: dra-full-gpu
  namespace: kai-lab20
  labels: { kai.scheduler/queue: default-queue, kai-scheduler-101/chapter: "20" }
spec:
  schedulerName: kai-scheduler
  restartPolicy: Never
  tolerations: [ { key: kwok.x-k8s.io/node, operator: Exists, effect: NoSchedule } ]
  resourceClaims:
    - name: gpu
      resourceClaimTemplateName: gpu-full
  containers:
    - name: app
      image: ubuntu:22.04
      command: ["bash", "-lc"]
      args: ["echo inspecting DRA allocation; sleep 3600"]
      resources:
        claims:
          - name: gpu
