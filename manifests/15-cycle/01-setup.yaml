apiVersion: v1
kind: Namespace
metadata:
  name: kai-lab15
  labels:
    kai-scheduler-101/chapter: "15"
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-one
  namespace: kai-lab15
  labels:
    kai-scheduler-101/chapter: "15"
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly: { allocationMode: ExactCount, count: 1, deviceClassName: gpu.nvidia.com }
---
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: cycle-demo
  labels:
    kai-scheduler-101/chapter: "15"
spec:
  resources:
    gpu: { quota: 32, limit: 32, overQuotaWeight: 1 }
