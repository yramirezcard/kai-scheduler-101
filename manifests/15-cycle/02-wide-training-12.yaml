apiVersion: batch/v1
kind: Job
metadata:
  name: wide-train-12
  namespace: kai-lab15
  labels:
    kai-scheduler-101/chapter: "15"
spec:
  parallelism: 12
  completions: 12
  template:
    metadata:
      labels:
        app: wide-train-12
        kai.scheduler/queue: cycle-demo
        kai-scheduler-101/chapter: "15"
    spec:
      schedulerName: kai-scheduler
      priorityClassName: train
      restartPolicy: Never
      tolerations: [ { key: kwok.x-k8s.io/node, operator: Exists, effect: NoSchedule } ]
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [kwok-gpu-01, kwok-gpu-02]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: wide-train-12
      resourceClaims: [ { name: gpu, resourceClaimTemplateName: gpu-one } ]
      containers:
        - name: trainer
          image: ubuntu:22.04
          command: ["bash", "-lc"]
          args: ["echo wide training worker; sleep 3600"]
          resources: { claims: [ { name: gpu } ] }
