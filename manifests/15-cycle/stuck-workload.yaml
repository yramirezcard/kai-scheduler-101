apiVersion: v1
kind: Namespace
metadata:
  name: kai-lab15
  labels:
    kai-scheduler-101/chapter: "15"
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-one
  namespace: kai-lab15
  labels:
    kai-scheduler-101/chapter: "15"
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly: { allocationMode: ExactCount, count: 1, deviceClassName: gpu.nvidia.com }
---
apiVersion: v1
kind: Pod
metadata:
  name: explain-pending
  namespace: kai-lab15
  labels:
    kai.scheduler/queue: default-queue
    kai-scheduler-101/chapter: "15"
spec:
  schedulerName: kai-scheduler
  restartPolicy: Never
  resourceClaims:
    - name: gpu
      resourceClaimTemplateName: gpu-one
  containers:
    - name: too-large
      image: ubuntu:22.04
      command: ["bash", "-lc"]
      args: ["sleep 3600"]
      resources: { claims: [ { name: gpu } ], requests: { cpu: "500" } }
