apiVersion: v1
kind: Namespace
metadata:
  name: kai-lab18
  labels:
    kai-scheduler-101/chapter: "18"
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-one
  namespace: kai-lab18
  labels:
    kai-scheduler-101/chapter: "18"
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly: { allocationMode: ExactCount, count: 1, deviceClassName: gpu.nvidia.com }
---
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: topology-demo
  labels:
    kai-scheduler-101/chapter: "18"
spec:
  resources:
    gpu: { quota: 24, limit: 48, overQuotaWeight: 1 }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rack-local-training
  namespace: kai-lab18
  labels:
    kai-scheduler-101/chapter: "18"
  annotations:
    kai.scheduler/topology: lab-topology
    kai.scheduler/topology-required-placement: kai.scheduler/topology-block
    kai.scheduler/topology-preferred-placement: kai.scheduler/topology-rack
    kai.scheduler/batch-min-member: "12"
spec:
  parallelism: 12
  completions: 12
  template:
    metadata: { labels: { kai.scheduler/queue: topology-demo, kai-scheduler-101/chapter: "18" } }
    spec:
      schedulerName: kai-scheduler
      priorityClassName: train
      restartPolicy: Never
      tolerations: [ { key: kwok.x-k8s.io/node, operator: Exists, effect: NoSchedule } ]
      resourceClaims: [ { name: gpu, resourceClaimTemplateName: gpu-one } ]
      containers:
        - name: worker
          image: ubuntu:22.04
          command: ["bash", "-lc"]
          args: ["echo rack-local; sleep 3600"]
          resources: { claims: [ { name: gpu } ] }
