apiVersion: v1
kind: Namespace
metadata:
  name: kai-lab16-spread
  labels:
    kai-scheduler-101/chapter: "16"
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-one
  namespace: kai-lab16-spread
  labels:
    kai-scheduler-101/chapter: "16"
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly: { allocationMode: ExactCount, count: 1, deviceClassName: gpu.nvidia.com }
---
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: spread-demo
  labels:
    kai-scheduler-101/chapter: "16"
    kai.scheduler/node-pool: placement-spread
spec:
  resources:
    gpu: { quota: 6, limit: 16, overQuotaWeight: 1 }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: spread-workers
  namespace: kai-lab16-spread
  labels:
    kai-scheduler-101/chapter: "16"
    kai.scheduler/node-pool: placement-spread
spec:
  parallelism: 6
  completions: 6
  template:
    metadata:
      labels:
        kai.scheduler/queue: spread-demo
        kai.scheduler/node-pool: placement-spread
        kai-scheduler-101/chapter: "16"
    spec:
      schedulerName: kai-scheduler
      priorityClassName: train
      restartPolicy: Never
      tolerations: [ { key: kwok.x-k8s.io/node, operator: Exists, effect: NoSchedule } ]
      resourceClaims: [ { name: gpu, resourceClaimTemplateName: gpu-one } ]
      containers:
        - name: worker
          image: ubuntu:22.04
          command: ["bash", "-lc"]
          args: ["echo spread worker; sleep 3600"]
          resources: { claims: [ { name: gpu } ] }
