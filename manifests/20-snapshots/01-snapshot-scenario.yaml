apiVersion: v1
kind: Namespace
metadata:
  name: kai-lab20
  labels:
    kai-scheduler-101/chapter: "20"
---
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: snapshot-demo
  labels:
    kai-scheduler-101/chapter: "20"
spec:
  resources:
    gpu: { quota: 1, limit: 2, overQuotaWeight: 1 }
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-one
  namespace: kai-lab20
  labels:
    kai-scheduler-101/chapter: "20"
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly: { allocationMode: ExactCount, count: 1, deviceClassName: gpu.nvidia.com }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapshot-workload
  namespace: kai-lab20
  labels:
    app: snapshot-workload
    kai-scheduler-101/chapter: "20"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: snapshot-workload
  template:
    metadata:
      labels:
        app: snapshot-workload
        kai.scheduler/queue: snapshot-demo
        kai-scheduler-101/chapter: "20"
    spec:
      schedulerName: kai-scheduler
      tolerations:
        - key: kwok.x-k8s.io/node
          operator: Exists
          effect: NoSchedule
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: gpu-one
      containers:
        - name: workload
          image: ubuntu:22.04
          command: ["bash", "-lc"]
          args: ["echo snapshot workload; sleep 3600"]
          resources:
            claims:
              - name: gpu
