apiVersion: v1
kind: Namespace
metadata:
  name: kai-lab06
  labels: { kai-scheduler-101/chapter: "06" }
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-one
  namespace: kai-lab06
  labels: { kai-scheduler-101/chapter: "06" }
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly: { allocationMode: ExactCount, count: 1, deviceClassName: gpu.nvidia.com }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision-team
  namespace: kai-lab06
  labels: { kai-scheduler-101/chapter: "06" }
spec:
  replicas: 4
  selector: { matchLabels: { app: vision-team } }
  template:
    metadata: { labels: { app: vision-team, kai.scheduler/queue: vision-team, kai-scheduler-101/chapter: "06" } }
    spec:
      schedulerName: kai-scheduler
      priorityClassName: train
      tolerations: [ { key: kwok.x-k8s.io/node, operator: Exists, effect: NoSchedule } ]
      resourceClaims: [ { name: gpu, resourceClaimTemplateName: gpu-one } ]
      containers:
        - name: vision
          image: ubuntu:22.04
          command: ["bash", "-lc"]
          args: ["echo vision training workload; sleep 3600"]
          resources: { claims: [ { name: gpu } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-team
  namespace: kai-lab06
  labels: { kai-scheduler-101/chapter: "06" }
spec:
  replicas: 3
  selector: { matchLabels: { app: llm-team } }
  template:
    metadata: { labels: { app: llm-team, kai.scheduler/queue: llm-team, kai-scheduler-101/chapter: "06" } }
    spec:
      schedulerName: kai-scheduler
      priorityClassName: train
      tolerations: [ { key: kwok.x-k8s.io/node, operator: Exists, effect: NoSchedule } ]
      resourceClaims: [ { name: gpu, resourceClaimTemplateName: gpu-one } ]
      containers:
        - name: llm
          image: ubuntu:22.04
          command: ["bash", "-lc"]
          args: ["echo llm training workload; sleep 3600"]
          resources: { claims: [ { name: gpu } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-processing
  namespace: kai-lab06
  labels: { kai-scheduler-101/chapter: "06" }
spec:
  replicas: 4
  selector: { matchLabels: { app: data-processing } }
  template:
    metadata: { labels: { app: data-processing, kai.scheduler/queue: data-processing, kai-scheduler-101/chapter: "06" } }
    spec:
      schedulerName: kai-scheduler
      priorityClassName: train
      tolerations: [ { key: kwok.x-k8s.io/node, operator: Exists, effect: NoSchedule } ]
      resourceClaims: [ { name: gpu, resourceClaimTemplateName: gpu-one } ]
      containers:
        - name: batch
          image: ubuntu:22.04
          command: ["bash", "-lc"]
          args: ["echo data processing workload; sleep 3600"]
          resources: { claims: [ { name: gpu } ] }
