apiVersion: v1
kind: Namespace
metadata:
  name: kai-lab08
  labels:
    kai-scheduler-101/chapter: "08"
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-one
  namespace: kai-lab08
  labels:
    kai-scheduler-101/chapter: "08"
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly: { allocationMode: ExactCount, count: 1, deviceClassName: gpu.nvidia.com }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reclaim-low-borrower
  namespace: kai-lab08
  labels:
    kai-scheduler-101/chapter: "08"
spec:
  replicas: 8
  selector:
    matchLabels: { app: reclaim-low-borrower }
  template:
    metadata:
      labels:
        app: reclaim-low-borrower
        kai.scheduler/queue: reclaim-low
        kai-scheduler-101/chapter: "08"
    spec:
      schedulerName: kai-scheduler
      priorityClassName: train
      tolerations:
        - key: kwok.x-k8s.io/node
          operator: Exists
          effect: NoSchedule
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: gpu-one
      containers:
        - name: trainer
          image: ubuntu:22.04
          command: ["bash", "-lc"]
          args: ["echo reclaim-low borrowed GPU; sleep 3600"]
          resources:
            claims:
              - name: gpu
