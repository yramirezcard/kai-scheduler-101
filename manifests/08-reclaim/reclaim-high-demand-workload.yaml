apiVersion: apps/v1
kind: Deployment
metadata:
  name: reclaim-high-demand
  namespace: kai-lab08
  labels:
    kai-scheduler-101/chapter: "08"
spec:
  replicas: 4
  selector:
    matchLabels: { app: reclaim-high-demand }
  template:
    metadata:
      labels:
        app: reclaim-high-demand
        kai.scheduler/queue: reclaim-high
        kai-scheduler-101/chapter: "08"
    spec:
      schedulerName: kai-scheduler
      priorityClassName: train
      tolerations:
        - key: kwok.x-k8s.io/node
          operator: Exists
          effect: NoSchedule
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: gpu-one
      containers:
        - name: trainer
          image: ubuntu:22.04
          command: ["bash", "-lc"]
          args: ["echo reclaim-high needs guaranteed GPUs; sleep 3600"]
          resources:
            claims:
              - name: gpu
