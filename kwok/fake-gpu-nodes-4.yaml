apiVersion: v1
kind: Node
metadata:
  name: kwok-gpu-01
  labels:
    type: kwok
    run.ai/simulated-gpu-node-pool: default
    nvidia.com/gpu.family: hopper
    nvidia.com/gpu.machine: NVIDIA-DGX-H100
    kai.scheduler/topology-block: block-a
    kai.scheduler/topology-rack: rack-a1
    kubernetes.io/hostname: kwok-gpu-01
spec:
  taints:
    - key: kwok.x-k8s.io/node
      effect: NoSchedule
status:
  capacity:
    cpu: "96"
    memory: 768Gi
    pods: "110"
  allocatable:
    cpu: "96"
    memory: 768Gi
    pods: "110"
